services:
  sevasetu:
    build: .
    image: sevasetu:onprem
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PORT: "8080"
      STATIC_DIR: /app/frontend/dist
      DATABASE_PATH: /data/sevasetu.db
      STORAGE_PATH: /data/uploads
      BACKUP_PATH: /data/backups
    volumes:
      - sevasetu-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Optional PostgreSQL for large datacenter deployments.
  # Set DATABASE_URL in .env and switch the API driver before enabling.
  # postgres:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: sevasetu
  #     POSTGRES_USER: sevasetu
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - sevasetu-pg:/var/lib/postgresql/data

volumes:
  sevasetu-data:
